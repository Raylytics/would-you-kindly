name: release

# Cut a GitHub release when a vX.Y.Z tag is pushed. `wyk update` and
# `wyk version --check` read the GitHub releases feed; `go install …@<tag>`
# remains the documented default install path. goreleaser additionally
# attaches prebuilt linux/darwin (amd64/arm64) archives + checksums and
# updates the Homebrew tap (raylytics/homebrew-wyk). The release notes come
# straight from the matching CHANGELOG.md section, so the changelog stays
# the single source of truth.
#
# Requires the HOMEBREW_TAP_GITHUB_TOKEN secret (a fine-grained PAT with
# contents:write on raylytics/homebrew-wyk) and that tap repo to exist.
# The first step proves the token can read AND push to the tap before
# anything is published: goreleaser pushes the cask last, so a bad token
# used to leave a half-release — GitHub release and assets live, brew
# still serving the previous version, and only a red run after the fact
# (v0.8.2, would-you-kindly-geyq). See .goreleaser.yaml and
# docs/OPERATOR.md "Releasing".
on:
  push:
    # Match the documented vX.Y.Z contract — require a digit after the `v`
    # so stray tags (vfoo, v-test, vnext) can't trigger a real release with
    # an empty-CHANGELOG placeholder body.
    tags: ['v[0-9]*']

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned for supply-chain safety (version in the trailing comment);
      # both run on the Node 24 runtime. Keep in sync with ci.yml.
      # fetch-depth: 0 — goreleaser reads the full tag history to compute
      # the version and changelog diff; a shallow clone breaks it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail here, with nothing published yet, if the tap token is empty,
      # rejected, or read-only. Two probes: a repo GET (clear message for an
      # empty or revoked token), then a `git push --dry-run` of a throwaway
      # ref, because GitHub authorises receive-pack before a dry run — that
      # is the write the cask publish needs, and the only test that catches
      # a fine-grained PAT granted Contents: read only (the API's
      # `permissions` object reports the token OWNER's role, not the PAT's
      # grants). Nothing is created. The token reaches git through a
      # credential helper, never a URL or an argument, so it cannot appear
      # in logs or the process list. actions/checkout persists this repo's
      # GITHUB_TOKEN as an http.extraheader in the workspace git config;
      # it is cleared for the probe, or git would send the wrong token and
      # get a 403 for the tap instead of asking the helper.
      - name: Verify the Homebrew tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAP_REPO: raylytics/homebrew-wyk
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is empty — set the repo secret before tagging (docs/OPERATOR.md, Releasing)"
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TAP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TAP_REPO")"
          if [ "$code" != 200 ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN cannot read $TAP_REPO (HTTP $code) — recreate the fine-grained PAT with Contents: read and write on that repo (docs/OPERATOR.md, Releasing)"
            exit 1
          fi
          if ! git -c http.https://github.com/.extraheader= \
                 -c credential.helper= \
                 -c credential.helper='!f() { echo username=x-access-token; echo "password=$TAP_TOKEN"; }; f' \
                 push --dry-run "https://github.com/$TAP_REPO.git" HEAD:refs/heads/release-preflight-probe >/dev/null 2>"$RUNNER_TEMP/push.err"; then
            sed 's/x-access-token:[^@]*@/x-access-token:***@/' "$RUNNER_TEMP/push.err" >&2
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN can read $TAP_REPO but a dry-run push was refused — the fine-grained PAT needs Contents: read AND write on that repo (docs/OPERATOR.md, Releasing)"
            exit 1
          fi
          echo "tap token OK: read + push (dry run) on $TAP_REPO"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Extract release notes from CHANGELOG
        # Written to $RUNNER_TEMP, NOT the work tree: goreleaser
        # hard-fails a release from a dirty tree, and an untracked
        # notes.md counts as dirt (first v0.7.0 attempt died on this;
        # --snapshot validation skips the git-state check, which is
        # why local testing never caught it).
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # Pull the lines between "## [<ver>]" and the next "## [" header,
          # buffering them so the END block can strip the blank lines that
          # bracket the section (the blank under the header and the ones
          # before the next header) — otherwise the release notes render
          # with leading/trailing whitespace. Single awk, no GNU-only tools.
          awk -v hdr="## [$ver]" '
            index($0, hdr) == 1 { grab = 1; next }
            grab && /^## \[/    { exit }
            grab                { lines[++n] = $0 }
            END {
              s = 1; while (s <= n && lines[s] ~ /^[[:space:]]*$/) s++
              e = n; while (e >= s && lines[e] ~ /^[[:space:]]*$/) e--
              for (i = s; i <= e; i++) print lines[i]
            }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "No CHANGELOG.md section for $ver — using a placeholder." >&2
            echo "Release ${GITHUB_REF_NAME}. See CHANGELOG.md." > "$RUNNER_TEMP/notes.md"
          fi

      # goreleaser builds the binaries, attaches the archives + checksums,
      # creates the GitHub release with the CHANGELOG-derived notes, and
      # pushes the updated cask to the tap. Replaces the old `gh release
      # create` step (goreleaser's build across 4 platforms is also the
      # compile sanity check).
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
